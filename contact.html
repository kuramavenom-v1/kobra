<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header class="navbar">

<div class="container">

<a href="index.html" class="logo">Korda</a>

<nav>

<ul class="nav-links">

</nav>

</div>

</header>

<section class="page-banner">

<div class="container">

<h1>Contact Us</h1>

<p>

Let's discuss your next project.

</p>

</div>

</section>

<main>

<section class="contact">

<div class="container">

<div class="contact-wrapper">

<div class="contact-info">

<h2>Get In Touch</h2>

<div class="info">

<i class="fas fa-location-dot"></i>

<div>

<h4>Address</h4>

<p>Riyadh, Saudi Arabia</p>

</div>

</div>

<div class="info">

<i class="fas fa-phone"></i>

<div>

<h4>Phone</h4>

<p>+966 500 000 000</p>

</div>

</div>

<div class="info">

<i class="fas fa-envelope"></i>

<div>

<h4>Email</h4>

<p>info@korda.com</p>

</div>

</div>

</div>
<div class="contact-form">

<form>

<input
type="text"
placeholder="Full Name"
required>

<input
type="email"
placeholder="Email Address"
required>

<input
type="tel"
placeholder="Phone Number">

<input
type="text"
placeholder="Subject">

<textarea
rows="7"
placeholder="Your Message"
required></textarea>

<button
type="submit">

Send Message

</button>

</form>

</div>

</div>

</div>

</section>

<section class="map">

<iframe
src="https://maps.google.com/maps?q=riyadh&t=&z=13&ie=UTF8&iwloc=&output=embed"
loading="lazy">
</iframe>

</section>

</main>
<footer>

<div class="container">

<p>

© 2025 Korda. All Rights Reserved.

</p>

</div>

</footer>

</body>
